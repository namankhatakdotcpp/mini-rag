<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mini RAG Console</title>
    <style>
      :root {
        --bg: #0f1221;
        --panel: #161a2e;
        --panel-accent: #1f2440;
        --text: #e9ecf8;
        --muted: #aab1d1;
        --accent: #7ce7ff;
        --accent-2: #f4b7ff;
        --danger: #ff7a7a;
        --success: #7dffb3;
        --shadow: 0 18px 40px rgba(7, 10, 24, 0.4);
        --radius: 16px;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: radial-gradient(circle at top, #1c2144 0%, #0f1221 60%);
        color: var(--text);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        min-height: 100vh;
      }

      header { padding: 36px 24px 18px; text-align: center; }
      header h1 {
        font-size: clamp(26px, 4vw, 42px);
        letter-spacing: -0.02em;
        margin-bottom: 8px;
      }
      header p { color: var(--muted); font-size: 15px; }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 24px 48px;
        display: grid;
        gap: 24px;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      }

      .panel {
        background: linear-gradient(160deg, var(--panel), var(--panel-accent));
        border-radius: var(--radius);
        padding: 24px;
        box-shadow: var(--shadow);
        border: 1px solid rgba(124, 231, 255, 0.12);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .panel h2 { font-size: 18px; color: var(--accent); }

      label {
        display: block;
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 6px;
      }

      textarea {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(124, 231, 255, 0.2);
        background: rgba(15, 18, 33, 0.9);
        color: var(--text);
        font-family: inherit;
        font-size: 14px;
        resize: vertical;
      }
      textarea:focus { outline: none; border-color: rgba(124, 231, 255, 0.6); }

      /* File drop zone */
      .file-drop {
        position: relative;
        border: 2px dashed rgba(124, 231, 255, 0.25);
        border-radius: 12px;
        padding: 18px;
        text-align: center;
        cursor: pointer;
        transition: border-color 0.2s;
      }
      .file-drop:hover { border-color: var(--accent); }
      .file-drop input[type="file"] {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
        width: 100%;
        height: 100%;
      }
      .file-drop p { font-size: 13px; color: var(--muted); pointer-events: none; }
      .file-drop p span { color: var(--accent); }
      .file-name { font-size: 12px; color: var(--accent-2); min-height: 18px; margin-top: 4px; }

      .btn {
        padding: 12px 20px;
        border-radius: 999px;
        background: linear-gradient(120deg, var(--accent), var(--accent-2));
        border: none;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        color: #0f1221;
        transition: opacity 0.15s, transform 0.15s;
        box-shadow: 0 8px 20px rgba(124, 231, 255, 0.2);
      }
      .btn:hover:not(:disabled) { transform: translateY(-1px); }
      .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

      .status { font-size: 13px; color: var(--muted); min-height: 18px; }
      .status.error   { color: var(--danger); }
      .status.success { color: var(--success); }

      /* Chat box */
      .chat-box {
        background: rgba(9, 12, 24, 0.7);
        border-radius: 12px;
        padding: 14px;
        min-height: 180px;
        max-height: 380px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .chat-empty {
        color: var(--muted);
        font-size: 13px;
        text-align: center;
        margin: auto;
      }

      .bubble {
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.55;
        max-width: 92%;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .bubble.user {
        background: linear-gradient(120deg, rgba(124, 231, 255, 0.12), rgba(244, 183, 255, 0.12));
        border: 1px solid rgba(124, 231, 255, 0.2);
        align-self: flex-end;
      }
      .bubble.bot {
        background: rgba(31, 36, 64, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.06);
        align-self: flex-start;
      }
      .bubble.thinking { color: var(--muted); font-style: italic; }

      /* Citations */
      .section-label {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .citations { display: flex; flex-direction: column; gap: 10px; }

      .cite-card {
        background: rgba(9, 12, 24, 0.7);
        border-radius: 12px;
        padding: 12px 14px;
        border: 1px solid rgba(124, 231, 255, 0.1);
      }
      .cite-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 4px;
      }
      .cite-book  { font-size: 13px; color: var(--accent); font-weight: 600; }
      .cite-page  { font-size: 12px; color: var(--accent-2); white-space: nowrap; }
      .cite-score { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
      .cite-preview { font-size: 12px; color: var(--muted); line-height: 1.5; }

      /* Active document chip */
      .doc-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(124, 231, 255, 0.08);
        border: 1px solid rgba(124, 231, 255, 0.25);
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 12px;
        color: var(--accent);
      }
      .doc-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
      .doc-chip button {
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        padding: 0;
      }
      .doc-chip button:hover { color: var(--danger); }

      /* Search-scope toggle */
      .scope-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .scope-row input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }
      .scope-row label { text-transform: none; font-size: 12px; cursor: pointer; }

      /* Meta row */
      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        background: rgba(9, 12, 24, 0.5);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 12px;
        color: var(--muted);
      }
      .meta-row b { color: var(--text); }
    </style>
  </head>

  <body>
    <header>
      <h1>Mini RAG Console</h1>
      <p>Ingest documents &rarr; Ask questions &rarr; Get grounded answers with citations</p>
    </header>

    <main class="container">

      <!-- ── INGEST PANEL ── -->
      <section class="panel">
        <h2>Ingest Content</h2>

        <div>
          <label for="ingestText">Paste text</label>
          <textarea id="ingestText" rows="5" placeholder="Paste content to ingest…"></textarea>
        </div>

        <div>
          <label>Upload PDF or text file</label>
          <div class="file-drop">
            <input type="file" id="ingestFile" accept=".pdf,.txt,.md" multiple />
            <p>Drop files here or <span>browse</span></p>
          </div>
          <div class="file-name" id="fileName"></div>
        </div>

        <button class="btn" id="ingestBtn">Ingest</button>
        <div class="status" id="ingestStatus"></div>
        <div id="docChip" style="display:none" class="doc-chip">
          <span class="dot"></span>
          <span id="docChipLabel"></span>
          <button id="clearDocBtn" title="Clear — search all documents">&times;</button>
        </div>
      </section>

      <!-- ── QUERY PANEL ── -->
      <section class="panel">
        <h2>Ask a Question</h2>

        <div class="chat-box" id="chatBox">
          <div class="chat-empty" id="chatEmpty">Answers will appear here</div>
        </div>

        <div>
          <label for="question">Question <span style="color:var(--muted);font-size:10px;text-transform:none">(Enter to submit, Shift+Enter for newline)</span></label>
          <textarea id="question" rows="3" placeholder="Ask something grounded in your documents…"></textarea>
        </div>

        <div class="scope-row" id="scopeRow" style="display:none">
          <input type="checkbox" id="searchAllChk" />
          <label for="searchAllChk">Search all documents (ignore active document filter)</label>
        </div>

        <button class="btn" id="queryBtn">Run Query</button>
        <div class="status" id="queryStatus"></div>

        <div id="citationsWrap" style="display:none; flex-direction:column; gap:10px">
          <div class="section-label">Sources</div>
          <div class="citations" id="citationsList"></div>
          <div class="meta-row" id="metaRow" style="display:none"></div>
        </div>
      </section>

    </main>

    <script>
      // Relative paths work when FastAPI is serving this page (same origin).
      // Fall back to an explicit address for file:// and any other dev server port.
      const API_BASE = (window.location.port === "8000" || window.location.protocol === "https:")
        ? ""
        : "http://127.0.0.1:8000";

      const ingestText    = document.getElementById("ingestText");
      const ingestFile    = document.getElementById("ingestFile");
      const ingestBtn     = document.getElementById("ingestBtn");
      const ingestStatus  = document.getElementById("ingestStatus");
      const fileNameEl    = document.getElementById("fileName");
      const docChip       = document.getElementById("docChip");
      const docChipLabel  = document.getElementById("docChipLabel");
      const clearDocBtn   = document.getElementById("clearDocBtn");

      const questionEl    = document.getElementById("question");
      const queryBtn      = document.getElementById("queryBtn");
      const queryStatus   = document.getElementById("queryStatus");
      const chatBox       = document.getElementById("chatBox");
      const chatEmpty     = document.getElementById("chatEmpty");
      const citationsWrap = document.getElementById("citationsWrap");
      const citationsList = document.getElementById("citationsList");
      const metaRow       = document.getElementById("metaRow");
      const scopeRow      = document.getElementById("scopeRow");
      const searchAllChk  = document.getElementById("searchAllChk");

      // Tracks the document_id returned by the last successful upload.
      // Sent with every query so retrieval stays scoped to that document.
      let activeDocId  = null;
      let activeSource = null;

      const setActiveDoc = (docId, source) => {
        activeDocId  = docId;
        activeSource = source;
        if (docId) {
          docChipLabel.textContent = source;
          docChip.style.display    = "inline-flex";
          scopeRow.style.display   = "flex";
        } else {
          docChip.style.display  = "none";
          scopeRow.style.display = "none";
          searchAllChk.checked   = false;
        }
      };

      clearDocBtn.addEventListener("click", () => setActiveDoc(null, null));

      // ── Helpers ──────────────────────────────────────────────────────────────

      const setStatus = (el, msg, type = "") => {
        el.textContent = msg;
        el.className = "status" + (type ? " " + type : "");
      };

      const safeJson = async (res) => {
        try { return await res.json(); } catch { return null; }
      };

      const addBubble = (text, cls) => {
        chatEmpty.style.display = "none";
        const el = document.createElement("div");
        el.className = "bubble " + cls;
        el.textContent = text;
        chatBox.appendChild(el);
        chatBox.scrollTop = chatBox.scrollHeight;
        return el;
      };

      // ── File input label ─────────────────────────────────────────────────────

      ingestFile.addEventListener("change", () => {
        const names = [...ingestFile.files].map(f => f.name).join(", ");
        fileNameEl.textContent = names;
      });

      // ── Ingest ───────────────────────────────────────────────────────────────

      ingestBtn.addEventListener("click", async () => {
        const text  = ingestText.value.trim();
        const files = ingestFile.files;

        if (!text && !files.length) {
          setStatus(ingestStatus, "Provide text or select a file.", "error");
          return;
        }

        ingestBtn.disabled = true;
        setStatus(ingestStatus, "Ingesting…");

        try {
          const fd = new FormData();
          if (text) fd.append("text", text);
          for (const f of files) fd.append("file", f);

          const res  = await fetch(`${API_BASE}/upload`, { method: "POST", body: fd });
          const data = await safeJson(res);

          if (!res.ok) {
            throw new Error(data?.detail || `Server error ${res.status}`);
          }

          const n      = data?.chunks ?? 0;
          const source = data?.source ?? "input";
          setStatus(ingestStatus, `✓ Ingested ${n} chunks from "${source}".`, "success");
          setActiveDoc(data?.document_id ?? null, source);
          ingestText.value       = "";
          ingestFile.value       = "";
          fileNameEl.textContent = "";
        } catch (err) {
          setStatus(ingestStatus, err.message, "error");
        } finally {
          ingestBtn.disabled = false;
        }
      });

      // ── Query ────────────────────────────────────────────────────────────────

      const runQuery = async () => {
        const q = questionEl.value.trim();
        if (!q) {
          setStatus(queryStatus, "Enter a question.", "error");
          return;
        }

        queryBtn.disabled = true;
        citationsWrap.style.display = "none";
        citationsList.innerHTML = "";
        metaRow.style.display   = "none";
        metaRow.innerHTML       = "";

        addBubble(q, "user");
        const thinking = addBubble("Thinking…", "bot thinking");
        setStatus(queryStatus, "Querying…");

        try {
          const fd = new FormData();
          fd.append("question", q);
          // Send document_id unless the user explicitly chose "search all"
          if (activeDocId && !searchAllChk.checked) {
            fd.append("document_id", activeDocId);
          }

          const res  = await fetch(`${API_BASE}/query`, { method: "POST", body: fd });
          const data = await safeJson(res);

          if (!res.ok) {
            throw new Error(data?.detail || `Server error ${res.status}`);
          }

          thinking.textContent = data?.answer || "No answer returned.";
          thinking.classList.remove("thinking");

          // ── Structured citations ──
          const cites = data?.citations ?? [];
          if (cites.length) {
            citationsWrap.style.display = "flex";
            cites.forEach((c, i) => {
              const card = document.createElement("div");
              card.className = "cite-card";
              card.innerHTML = `
                <div class="cite-header">
                  <span class="cite-book">[${i + 1}] ${escHtml(c.book_name)}</span>
                  <span class="cite-page">Page&nbsp;${c.page_number}</span>
                </div>
                <div class="cite-score">Relevance score: ${c.rerank_score != null ? c.rerank_score.toFixed(3) : "—"}</div>
                <div class="cite-preview">${escHtml(c.preview ?? "")}</div>
              `;
              citationsList.appendChild(card);
            });
          }

          // ── Metadata ──
          const m = data?.meta;
          if (m) {
            metaRow.innerHTML = `
              <span>&#9201; <b>${m.time}</b></span>
              <span>&#128202; <b>${m.tokens ?? "—"}</b> tokens</span>
              <span>&#129302; <b>${escHtml(m.model || "gemini")}</b></span>
              <span>&#128196; <b>${m.chunks_retrieved}</b> chunks</span>
            `;
            metaRow.style.display = "flex";
            citationsWrap.style.display = "flex";
          }

          questionEl.value = "";
          setStatus(queryStatus, "Done.", "success");
        } catch (err) {
          thinking.textContent = `Error: ${err.message}`;
          thinking.classList.remove("thinking");
          setStatus(queryStatus, err.message, "error");
        } finally {
          queryBtn.disabled = false;
        }
      };

      queryBtn.addEventListener("click", runQuery);

      questionEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          runQuery();
        }
      });

      // ── XSS guard ────────────────────────────────────────────────────────────
      const escHtml = (str) => str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    </script>
  </body>
</html>
